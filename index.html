<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Candy Crush Match-3</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Fredoka One', 'Nunito', cursive, sans-serif;
            user-select: none;
            background: linear-gradient(135deg, #18092b 0%, #35104d 50%, #5e1363 100%);
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .candy-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #881337, 0 10px 20px rgba(0,0,0,0.4);
        }
        .candy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #881337, 0 14px 24px rgba(0,0,0,0.4);
        }
        .candy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #881337, 0 6px 10px rgba(0,0,0,0.4);
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 3px 3px 0px #4c0519;
        }

        /* Floating background bubble decoration */
        .bg-bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.25);
            pointer-events: none;
            animation: floatUp 14s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="relative min-h-screen overflow-hidden select-none">

    <!-- Background Bubbles -->
    <div id="bubbles-container" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-10 cursor-pointer"></div>

    <!-- UI Overlay Header -->
    <div class="absolute top-4 left-0 right-0 z-20 flex justify-between items-center px-4 md:px-12 pointer-events-none">
        
        <!-- Score Card -->
        <div class="glass-panel px-5 py-2.5 rounded-3xl flex items-center gap-3 pointer-events-auto border-pink-400/40">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-200 flex items-center justify-center text-xl text-amber-900 shadow-md">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <div class="text-[10px] uppercase tracking-wider text-pink-200 font-bold">Оноо</div>
                <div id="score-text" class="text-2xl text-white font-black tracking-wide">0</div>
            </div>
        </div>

        <!-- Combo Overlay text -->
        <div id="combo-display" class="opacity-0 pointer-events-none text-center transform scale-50 transition-all duration-300">
            <span id="combo-text" class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-400 to-purple-300 text-glow italic">
                SWEET!
            </span>
        </div>

        <!-- Target & Moves Card -->
        <div class="flex gap-3 pointer-events-auto">
            <div class="glass-panel px-4 py-2.5 rounded-3xl flex items-center gap-2 border-indigo-400/40">
                <div class="text-right">
                    <div class="text-[10px] uppercase tracking-wider text-indigo-200 font-bold">Бай Оноо</div>
                    <div id="target-text" class="text-xl text-yellow-300 font-black">2000</div>
                </div>
            </div>

            <div class="glass-panel px-5 py-2.5 rounded-3xl flex items-center gap-3 border-purple-400/40">
                <div class="text-right">
                    <div class="text-[10px] uppercase tracking-wider text-purple-200 font-bold">Нүүдэл</div>
                    <div id="moves-text" class="text-2xl text-white font-black tracking-wide">20</div>
                </div>
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-300 flex items-center justify-center text-xl text-white shadow-md">
                    <i class="fa-solid fa-hand-pointer"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="absolute bottom-5 left-0 right-0 z-20 flex justify-center items-center gap-4 pointer-events-none">
        <button id="btn-restart" class="candy-btn bg-gradient-to-r from-pink-500 to-rose-600 text-white font-black py-2.5 px-6 rounded-2xl text-base flex items-center gap-2 pointer-events-auto">
            <i class="fa-solid fa-rotate-right"></i> Шинээр эхлэх
        </button>
    </div>

    <!-- Game Over / Victory Modal -->
    <div id="game-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md p-4">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full text-center border-2 border-white/40 shadow-2xl transform transition-all scale-100">
            <div id="modal-icon" class="text-6xl mb-4 text-yellow-300">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h2 id="modal-title" class="text-4xl font-black text-white mb-2 text-glow">БАЯР ХҮРГЭЭЕ!</h2>
            <p id="modal-desc" class="text-pink-100 font-bold text-base mb-6">Та бүх даалгаврыг амжилттай биелүүллээ!</p>
            
            <div class="bg-purple-950/60 p-4 rounded-2xl mb-6 border border-purple-500/30">
                <div class="text-xs text-purple-200 uppercase tracking-widest mb-1">Эцсийн оноо</div>
                <div id="final-score" class="text-5xl font-black text-yellow-300">0</div>
            </div>

            <button id="modal-btn" class="candy-btn w-full bg-gradient-to-r from-emerald-400 to-teal-600 text-white font-black py-3.5 rounded-2xl text-xl">
                ДАХИН ТОГЛОХ
            </button>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script>
        // --- CONFIGURATION & GAME STATE ---
        const GRID_SIZE = 8;
        const CANDY_TYPES = 6;
        const CELL_SIZE = 1.1;
        const TARGET_SCORE = 2000;
        const INITIAL_MOVES = 20;

        const BOARD_OFFSET_X = -(GRID_SIZE * CELL_SIZE) / 2 + CELL_SIZE / 2;
        const BOARD_OFFSET_Y = -(GRID_SIZE * CELL_SIZE) / 2 + CELL_SIZE / 2;

        let score = 0;
        let movesLeft = INITIAL_MOVES;
        let isAnimating = false;
        let selectedCandy = null;
        let dragStartCandy = null;
        let grid = []; // 2D Array [row][col]
        let comboCount = 0;

        // Three.js Components
        let scene, camera, renderer;
        let candyGroup;
        let raycaster, mouse;
        let particles = [];

        // Candy Configurations (6 distinct shapes & vibrant materials)
        const CANDY_CONFIGS = [
            { type: 0, color: 0xFF0055, emissive: 0xFF0033, shape: 'sphere' },   // Strawberry Gumball
            { type: 1, color: 0x00FF66, emissive: 0x00CC44, shape: 'cube' },     // Lime Wrapper
            { type: 2, color: 0x00E5FF, emissive: 0x00B2FF, shape: 'torus' },    // Mint Donut
            { type: 3, color: 0xFFB700, emissive: 0xFF8800, shape: 'pyramid' },  // Orange Cone
            { type: 4, color: 0xAA00FF, emissive: 0x7700CC, shape: 'diamond' },  // Grape Gem
            { type: 5, color: 0xFF00AA, emissive: 0xCC0088, shape: 'cylinder' }  // Candy Bar
        ];

        // --- BACKGROUND DECORATION ---
        function createBubbles() {
            const container = document.getElementById('bubbles-container');
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bg-bubble';
                const size = Math.random() * 50 + 20;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDuration = `${Math.random() * 8 + 10}s`;
                bubble.style.animationDelay = `${Math.random() * 4}s`;
                container.appendChild(bubble);
            }
        }

        // --- THREE.JS SETUP ---
        function init3D() {
            const container = document.getElementById('canvas-container');

            // Scene & Fog
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x18092b, 0.025);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 13.5);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Raycaster & Mouse
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(6, 12, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xff66cc, 1.2, 25);
            pointLight.position.set(0, 0, 8);
            scene.add(pointLight);

            // Candy Container Group
            candyGroup = new THREE.Group();
            scene.add(candyGroup);

            // Board Backing Graphic
            createBoardBacking();

            // Window Resizing
            window.addEventListener('resize', onWindowResize);

            // Input Interaction Listeners
            container.addEventListener('pointerdown', onPointerDown);
            container.addEventListener('pointerup', onPointerUp);

            // Initialize Grid & Loop
            initBoard();
            animate();
        }

        function createBoardBacking() {
            const width = GRID_SIZE * CELL_SIZE + 0.3;
            const height = GRID_SIZE * CELL_SIZE + 0.3;
            
            // Glass Background Board
            const geo = new THREE.BoxGeometry(width, height, 0.2);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0x1f0933,
                transparent: true,
                opacity: 0.65,
                roughness: 0.1,
                metalness: 0.1,
                clearcoat: 1.0
            });
            const boardMesh = new THREE.Mesh(geo, mat);
            boardMesh.position.z = -0.35;
            scene.add(boardMesh);

            // Grid Tiles Pattern
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const tileGeo = new THREE.PlaneGeometry(CELL_SIZE - 0.08, CELL_SIZE - 0.08);
                    const tileMat = new THREE.MeshBasicMaterial({
                        color: (r + c) % 2 === 0 ? 0xffffff : 0x000000,
                        transparent: true,
                        opacity: 0.06
                    });
                    const tile = new THREE.Mesh(tileGeo, tileMat);
                    tile.position.set(
                        BOARD_OFFSET_X + c * CELL_SIZE,
                        BOARD_OFFSET_Y + r * CELL_SIZE,
                        -0.24
                    );
                    scene.add(tile);
                }
            }
        }

        // --- CANDY GEOMETRY & MATERIAL GENERATOR ---
        function createCandyMesh(type) {
            const config = CANDY_CONFIGS[type];
            let geometry;

            switch (config.shape) {
                case 'sphere':
                    geometry = new THREE.SphereGeometry(0.38, 32, 32);
                    break;
                case 'cube':
                    geometry = new THREE.BoxGeometry(0.58, 0.58, 0.58);
                    break;
                case 'torus':
                    geometry = new THREE.TorusGeometry(0.28, 0.14, 16, 32);
                    break;
                case 'pyramid':
                    geometry = new THREE.ConeGeometry(0.4, 0.68, 4);
                    break;
                case 'diamond':
                    geometry = new THREE.OctahedronGeometry(0.42, 0);
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(0.32, 0.32, 0.58, 24);
                    break;
            }

            const material = new THREE.MeshPhysicalMaterial({
                color: config.color,
                emissive: config.emissive,
                emissiveIntensity: 0.2,
                metalness: 0.15,
                roughness: 0.1,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
                reflectivity: 0.9,
                transmission: 0.05
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Subtle rotation for visual depth
            mesh.rotation.x = Math.random() * 0.4;
            mesh.rotation.y = Math.random() * 0.4;

            return mesh;
        }

        // --- BOARD GENERATION & MATCH VALIDATION ---
        function initBoard() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    let type;
                    // Prevent initial 3-matches
                    do {
                        type = Math.floor(Math.random() * CANDY_TYPES);
                    } while (
                        (c >= 2 && grid[r][c - 1]?.type === type && grid[r][c - 2]?.type === type) ||
                        (r >= 2 && grid[r - 1][c]?.type === type && grid[r - 2][c]?.type === type)
                    );

                    spawnCandy(r, c, type);
                }
            }
        }

        function spawnCandy(row, col, type, dropHeight = 0) {
            const mesh = createCandyMesh(type);
            const targetX = BOARD_OFFSET_X + col * CELL_SIZE;
            const targetY = BOARD_OFFSET_Y + row * CELL_SIZE;

            mesh.position.set(targetX, targetY + dropHeight, 0);
            candyGroup.add(mesh);

            const candy = { row, col, type, mesh };
            grid[row][col] = candy;

            if (dropHeight > 0) {
                gsap.to(mesh.position, {
                    y: targetY,
                    duration: 0.45 + dropHeight * 0.04,
                    ease: "bounce.out"
                });
            }

            return candy;
        }

        // --- INTERACTION & DRAG/CLICK HANDLERS ---
        function getCandyFromPointer(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(candyGroup.children);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                return findCandyByMesh(clickedMesh);
            }
            return null;
        }

        function onPointerDown(event) {
            if (isAnimating || movesLeft <= 0) return;
            const candy = getCandyFromPointer(event);
            if (candy) {
                dragStartCandy = candy;
                selectCandy(candy);
            }
        }

        function onPointerUp(event) {
            if (isAnimating || !dragStartCandy || movesLeft <= 0) return;

            const candyUp = getCandyFromPointer(event);
            if (candyUp && candyUp !== dragStartCandy) {
                if (isAdjacent(dragStartCandy, candyUp)) {
                    const c1 = dragStartCandy;
                    const c2 = candyUp;
                    deselectCandy();
                    dragStartCandy = null;
                    trySwap(c1, c2);
                    return;
                }
            }

            // If simple click selection
            if (candyUp === dragStartCandy) {
                if (selectedCandy && selectedCandy !== dragStartCandy) {
                    if (isAdjacent(selectedCandy, dragStartCandy)) {
                        const c1 = selectedCandy;
                        const c2 = dragStartCandy;
                        deselectCandy();
                        dragStartCandy = null;
                        trySwap(c1, c2);
                        return;
                    }
                }
            }
            dragStartCandy = null;
        }

        function selectCandy(candy) {
            if (selectedCandy && selectedCandy !== candy) {
                deselectCandy();
            }
            selectedCandy = candy;
            gsap.to(candy.mesh.scale, { x: 1.25, y: 1.25, z: 1.25, duration: 0.18 });
            gsap.to(candy.mesh.material, { emissiveIntensity: 0.5, duration: 0.18 });
        }

        function deselectCandy() {
            if (selectedCandy) {
                gsap.to(selectedCandy.mesh.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.18 });
                gsap.to(selectedCandy.mesh.material, { emissiveIntensity: 0.2, duration: 0.18 });
                selectedCandy = null;
            }
        }

        function isAdjacent(c1, c2) {
            const rowDiff = Math.abs(c1.row - c2.row);
            const colDiff = Math.abs(c1.col - c2.col);
            return (rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1);
        }

        function findCandyByMesh(mesh) {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] && grid[r][c].mesh === mesh) return grid[r][c];
                }
            }
            return null;
        }

        // --- SWAP & MATCH PROCESSING LOGIC ---
        async function trySwap(c1, c2) {
            isAnimating = true;

            // Memory swap
            swapGridEntries(c1, c2);

            // Animate 3D movement
            await animateSwap(c1, c2);

            // Check for valid matches
            const matches = findMatches();

            if (matches.length > 0) {
                movesLeft--;
                updateUI();
                comboCount = 0;

                await processMatches(matches);

                checkGameEnd();
            } else {
                // Invalid move: revert back
                swapGridEntries(c1, c2);
                await animateSwap(c1, c2);
            }

            isAnimating = false;
        }

        function swapGridEntries(c1, c2) {
            const r1 = c1.row, col1 = c1.col;
            const r2 = c2.row, col2 = c2.col;

            grid[r1][col1] = c2;
            grid[r2][col2] = c1;

            c1.row = r2; c1.col = col2;
            c2.row = r1; c2.col = col1;
        }

        function animateSwap(c1, c2) {
            return new Promise((resolve) => {
                const x1 = BOARD_OFFSET_X + c1.col * CELL_SIZE;
                const y1 = BOARD_OFFSET_Y + c1.row * CELL_SIZE;
                const x2 = BOARD_OFFSET_X + c2.col * CELL_SIZE;
                const y2 = BOARD_OFFSET_Y + c2.row * CELL_SIZE;

                gsap.to(c1.mesh.position, { x: x1, y: y1, z: 0.15, duration: 0.22, yoyo: true, repeat: 1 });
                gsap.to(c2.mesh.position, { x: x2, y: y2, z: 0.0, duration: 0.22, onComplete: resolve });
            });
        }

        // --- MATCH SEARCH ALGORITHM ---
        function findMatches() {
            let matchedCandies = new Set();

            // Horizontal Matches
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE - 2; c++) {
                    const matchLen = getHorizontalMatchLength(r, c);
                    if (matchLen >= 3) {
                        for (let i = 0; i < matchLen; i++) {
                            matchedCandies.add(grid[r][c + i]);
                        }
                        c += matchLen - 1;
                    }
                }
            }

            // Vertical Matches
            for (let c = 0; c < GRID_SIZE; c++) {
                for (let r = 0; r < GRID_SIZE - 2; r++) {
                    const matchLen = getVerticalMatchLength(r, c);
                    if (matchLen >= 3) {
                        for (let i = 0; i < matchLen; i++) {
                            matchedCandies.add(grid[r + i][c]);
                        }
                        r += matchLen - 1;
                    }
                }
            }

            return Array.from(matchedCandies);
        }

        function getHorizontalMatchLength(row, col) {
            const type = grid[row][col]?.type;
            if (type === undefined) return 0;
            let len = 1;
            while (col + len < GRID_SIZE && grid[row][col + len]?.type === type) {
                len++;
            }
            return len;
        }

        function getVerticalMatchLength(row, col) {
            const type = grid[row][col]?.type;
            if (type === undefined) return 0;
            let len = 1;
            while (row + len < GRID_SIZE && grid[row + len][col]?.type === type) {
                len++;
            }
            return len;
        }

        // --- DESTROY & REFILL CASCADE ---
        async function processMatches(matches) {
            comboCount++;
            showComboText(comboCount);

            score += matches.length * 100 * comboCount;
            updateUI();

            // Pop animation and particle burst
            const popPromises = matches.map((c) => {
                createExplosion(c.mesh.position, CANDY_CONFIGS[c.type].color);
                return new Promise((res) => {
                    gsap.to(c.mesh.scale, {
                        x: 0, y: 0, z: 0, duration: 0.25, ease: "back.in(2)", onComplete: () => {
                            candyGroup.remove(c.mesh);
                            grid[c.row][c.col] = null;
                            res();
                        }
                    });
                });
            });

            await Promise.all(popPromises);

            // Gravity: Move top candies down
            await applyGravity();

            // Refill missing slots
            await refillBoard();

            // Chain reactions (Combos)
            const newMatches = findMatches();
            if (newMatches.length > 0) {
                await processMatches(newMatches);
            }
        }

        function applyGravity() {
            const dropPromises = [];

            for (let c = 0; c < GRID_SIZE; c++) {
                let emptySlots = 0;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (grid[r][c] === null) {
                        emptySlots++;
                    } else if (emptySlots > 0) {
                        const candy = grid[r][c];
                        const newRow = r - emptySlots;

                        grid[newRow][c] = candy;
                        grid[r][c] = null;
                        candy.row = newRow;

                        const targetY = BOARD_OFFSET_Y + newRow * CELL_SIZE;
                        const p = new Promise((res) => {
                            gsap.to(candy.mesh.position, {
                                y: targetY,
                                duration: 0.28 + emptySlots * 0.04,
                                ease: "bounce.out",
                                onComplete: res
                            });
                        });
                        dropPromises.push(p);
                    }
                }
            }

            return Promise.all(dropPromises);
        }

        function refillBoard() {
            const refillPromises = [];

            for (let c = 0; c < GRID_SIZE; c++) {
                let missingCount = 0;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (grid[r][c] === null) missingCount++;
                }

                for (let r = 0; r < GRID_SIZE; r++) {
                    if (grid[r][c] === null) {
                        const type = Math.floor(Math.random() * CANDY_TYPES);
                        const dropHeight = (GRID_SIZE - r + missingCount) * CELL_SIZE;
                        const candy = spawnCandy(r, c, type, dropHeight);

                        const targetY = BOARD_OFFSET_Y + r * CELL_SIZE;
                        const p = new Promise((res) => {
                            gsap.to(candy.mesh.position, {
                                y: targetY,
                                duration: 0.35 + r * 0.04,
                                ease: "bounce.out",
                                onComplete: res
                            });
                        });
                        refillPromises.push(p);
                    }
                }
            }

            return Promise.all(refillPromises);
        }

        // --- PARTICLE BURST SYSTEM ---
        function createExplosion(pos, hexColor) {
            const particleCount = 16;
            const pGroup = [];

            for (let i = 0; i < particleCount; i++) {
                const geo = new THREE.SphereGeometry(0.07, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ color: hexColor });
                const p = new THREE.Mesh(geo, mat);

                p.position.copy(pos);
                scene.add(p);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 3.5,
                    (Math.random() - 0.5) * 3.5,
                    Math.random() * 3.0
                );

                pGroup.push({ mesh: p, vel: velocity, life: 1.0 });
            }

            particles.push(...pGroup);
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.addScaledVector(p.vel, 0.016);
                p.vel.y -= 0.06; // Gravity effect
                p.life -= 0.035;

                p.mesh.scale.setScalar(Math.max(0, p.life));

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        // --- UI & GAME FLOW OVERLAYS ---
        function updateUI() {
            document.getElementById('score-text').innerText = score;
            document.getElementById('moves-text').innerText = movesLeft;
        }

        function showComboText(count) {
            if (count <= 1) return;

            const comboDisplay = document.getElementById('combo-display');
            const comboText = document.getElementById('combo-text');

            const labels = ["", "SWEET!", "DELICIOUS!", "DIVINE!!", "UNSTOPPABLE!!!"];
            const label = labels[Math.min(count, labels.length - 1)];

            comboText.innerText = `${label} x${count}`;
            
            gsap.killTweensOf(comboDisplay);
            gsap.fromTo(comboDisplay, 
                { opacity: 1, scale: 0.4, y: 30 },
                { opacity: 0, scale: 1.2, y: -50, duration: 1.2, ease: "power2.out" }
            );
        }

        function checkGameEnd() {
            if (score >= TARGET_SCORE || movesLeft <= 0) {
                setTimeout(() => {
                    const modal = document.getElementById('game-modal');
                    const title = document.getElementById('modal-title');
                    const desc = document.getElementById('modal-desc');
                    const icon = document.getElementById('modal-icon');

                    document.getElementById('final-score').innerText = score;

                    if (score >= TARGET_SCORE) {
                        title.innerText = "ЯЛАЛТ!";
                        desc.innerText = "Гайхалтай! Та бай оноонд хүрч яллаа!";
                        icon.innerHTML = `<i class="fa-solid fa-trophy text-yellow-300"></i>`;
                    } else {
                        title.innerText = "ТОГЛООМ ДУУСЛАА";
                        desc.innerText = "Нүүдэл дууслаа. Дахин оролдож үзээрэй!";
                        icon.innerHTML = `<i class="fa-solid fa-heart-crack text-rose-500"></i>`;
                    }

                    modal.classList.remove('hidden');
                }, 500);
            }
        }

        function resetGame() {
            // Remove existing meshes
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c]) {
                        candyGroup.remove(grid[r][c].mesh);
                    }
                }
            }

            score = 0;
            movesLeft = INITIAL_MOVES;
            selectedCandy = null;
            dragStartCandy = null;
            isAnimating = false;
            updateUI();

            document.getElementById('game-modal').classList.add('hidden');
            initBoard();
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Gentle candy floating effect
            const time = Date.now() * 0.0018;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const candy = grid[r][c];
                    if (candy && candy !== selectedCandy) {
                        candy.mesh.rotation.x = Math.sin(time + r) * 0.12;
                        candy.mesh.rotation.y += 0.012;
                    }
                }
            }

            updateParticles();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize application on load
        window.onload = () => {
            createBubbles();
            init3D();

            document.getElementById('btn-restart').addEventListener('click', resetGame);
            document.getElementById('modal-btn').addEventListener('click', resetGame);
        };
    </script>
</body>
